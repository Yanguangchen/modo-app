<!doctype html>
<html lang="en" data-theme="light" data-motion="full" data-surface="glass">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Clarity Workspace</title>
    <meta name="description" content="Calm structure for workplace requests, plans, focus sessions, and meetings. Clear, accessible, and private." />
    <meta name="keywords" content="clarity, productivity, workspace, calendar, focus mode, pomodoro, task management, neurodiversity, accessible workspace" />
    <meta name="author" content="Clarity Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://clarity.workspace/" />

    <!-- Theme & Color Scheme -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1118" />

    <!-- Web App & Native Homescreen Standalone Experience -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Clarity Workspace" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Clarity" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph (OG) Meta Data -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clarity Workspace" />
    <meta property="og:title" content="Clarity Workspace · Calm Workplace Structure" />
    <meta property="og:description" content="Calm structure for workplace requests, plans, focus sessions, and meetings. Clear, accessible, and private." />
    <meta property="og:url" content="https://clarity.workspace/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:secure_url" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clarity Workspace app logo and interface" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card Meta Data -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clarity Workspace · Calm Workplace Structure" />
    <meta name="twitter:description" content="Calm structure for workplace requests, plans, focus sessions, and meetings. Clear, accessible, and private." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Clarity Workspace app logo and interface" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
